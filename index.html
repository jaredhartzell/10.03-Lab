<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>To-Do List</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>To-Do List</h1>

    <!-- New task input -->
    <label for="new-task">New task:</label>
    <input type="text" id="new-task" maxlength="22">
    <button id="add-btn">Add</button>

    <!-- Task list -->
    <ol id="task-list">
        <li>
            <span class="task-row">
                <span class="task-text">Clean bathroom</span>
                <button class="done-btn">&#10006;</button>
            </span>
        </li>

        <li>
            <span class="task-row">
                <span class="task-text">Study for big exam</span>
                <button class="done-btn">&#10006;</button>
            </span>
        </li>

        <li>
            <span class="task-row">
                <span class="task-text">Feed fish</span>
                <button class="done-btn">&#10006;</button>
            </span>
        </li>
    </ol>

    <script src="script.js"></script>
</body>
</html>
